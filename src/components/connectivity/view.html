<section class="card control-grid" id="bluetooth-card">
<span class="control-icon" id="bluetooth-control" onclick="document.querySelector('#bluetooth-dialog').showModal()" title="Bluetooth"><svg viewbox="0 0 24 24"><path d="M12 2v20M12 2l7 6-7 5M12 22l7-6-7-5M5 7l14 9M5 17 19 8"></path></svg></span>
<span class="control-icon" id="network-control" onclick="document.querySelector('#network-dialog').showModal()" title="Wi-Fi"><svg viewbox="0 0 24 24"><path d="M4 10a13 13 0 0 1 16 0M8 15a6.5 6.5 0 0 1 8 0"></path><circle cx="12" cy="19" r="1.4"></circle></svg></span>
