<dialog class="dashboard-dialog connectivity-dialog" id="bluetooth-dialog" onclick="if(!event.target.closest('.connectivity-item'))closeDialog(this)"><div class="connectivity-panel" id="bluetooth-panel"><header><h2>Bluetooth</h2><div class="connectivity-actions"><button onclick="bluetoothCommand('power',this)">Turn on</button><button onclick="bluetoothCommand('scan',this)">Add device</button></div></header><main><p class="connectivity-empty">No devices</p></main></div></dialog>
<dialog class="dashboard-dialog connectivity-dialog" id="network-dialog" onclick="if(!event.target.closest('.connectivity-item'))closeDialog(this)"><div class="connectivity-panel" id="network-panel"><header><h2>Wi-Fi</h2><span>Networks</span></header><main><p class="connectivity-empty">No networks</p></main></div></dialog>
