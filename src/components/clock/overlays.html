<dialog class="dashboard-dialog" id="clock-dialog"><div class="dashboard-panel clock-panel"><section id="calendar"><div id="calendar-body"><h2 id="calendar-month"></h2><div class="weekdays"><span>Mo</span><span>Tu</span><span>We</span><span>Th</span><span>Fr</span><span>Sa</span><span>Su</span></div><div id="calendar-days"></div></div></section><section class="world-clocks"><div class="home-clock"><time id="minneapolis-clock">--:--:--</time><span>Minneapolis</span></div><div class="away-clocks"><div><time id="beijing-clock">--:--</time><span>Beijing</span><small id="beijing-delta"></small></div><div><time id="california-clock">--:--</time><span>California</span><small id="california-delta"></small></div><div><time id="new-york-clock">--:--</time><span>New York</span><small id="new-york-delta"></small></div></div></section><section class="timer"><div class="timer-picker"><div class="timer-wheels"><div class="timer-wheel" id="timer-hour"></div><div class="timer-wheel" id="timer-minute"></div><div class="timer-wheel" id="timer-second"></div></div><div class="timer-labels"><span>H</span><span>M</span><span>S</span></div><button id="timer-start">Start</button></div><output id="timer-output">00:00:00</output></section></div><div class="alarm-screen"><strong>Time’s up</strong><span>Timer</span><button id="alarm-stop">Stop</button></div></dialog>
