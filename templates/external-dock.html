<!doctype html>
<html lang="en"><head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Raylander External Dock</title><link rel="stylesheet" href="/assets/external-dock.css">
  <script src="/assets/htmx.min.js"></script><script src="/assets/htmx-ext-ws.js"></script>
  <script>
  const post = path => fetch(path, {method: "POST"});
  const closeDialog = dialog => {if(!dialog.open||dialog.classList.contains("closing"))return;dialog.classList.add("closing");setTimeout(()=>{dialog.close();dialog.classList.remove("closing")},240)};
  const openAgents=()=>document.querySelector("#agent-dialog").showModal();
  const focusAgent=id=>{fetch(`/agent/focus/${encodeURIComponent(id)}`,{method:"POST"});closeDialog(document.querySelector("#agent-dialog"))};
  let volumeTimer, pendingVolume;
  const sendVolume = () => { const value=pendingVolume; volumeTimer=undefined; post(`/volume/${value}`).finally(()=>{if(pendingVolume!==value&&!volumeTimer)volumeTimer=setTimeout(sendVolume,32)}) };
  const setVolume = value => {
    const percent = Math.max(0, Math.min(100, Math.round(value)));
    document.querySelector("#volume-fill").style.height = `${percent}%`;
    document.querySelector("#volume-dialog-fill").style.height = `${percent}%`;
    document.querySelector("#volume-dialog-value").textContent = `${percent}%`;
    pendingVolume=percent;
    if(!volumeTimer)volumeTimer=setTimeout(sendVolume,32);
  };
  const updateClock=()=>{const now=new Date(),time=document.querySelector("#local-time"),date=document.querySelector("#date"),timeZone="America/Chicago";if(time)time.textContent=now.toLocaleTimeString([],{hour:"2-digit",minute:"2-digit",hour12:false,timeZone});if(date)date.textContent=now.toLocaleDateString([],{month:"short",day:"numeric",weekday:"short",timeZone})};
  const syncDisplayPower=()=>{const state=document.querySelector("#display-power")?.dataset.on!=="false";globalThis.RaylanderAndroid?.setDisplayEnabled(state)};
  const bindGestures=()=>{
    const gauge=document.querySelector("#volume-gauge"),brightnessGauge=document.querySelector("#brightness-gauge");let startY=0,moved=false,last=-1,pendingBrightness=0;
    gauge.onpointerdown=e=>{e.preventDefault();startY=e.clientY;moved=false;gauge.setPointerCapture(e.pointerId)};
    gauge.onpointermove=e=>{if(!gauge.hasPointerCapture(e.pointerId))return;if(Math.abs(e.clientY-startY)>5)moved=true;const r=gauge.getBoundingClientRect(),value=(r.bottom-e.clientY)/r.height*100;if(moved&&Math.round(value)!==last){last=Math.round(value);setVolume(value)}};
    brightnessGauge.onpointerdown=e=>{e.preventDefault();startY=e.clientY;moved=false;brightnessGauge.setPointerCapture(e.pointerId)};
    brightnessGauge.onpointermove=e=>{if(!brightnessGauge.hasPointerCapture(e.pointerId))return;if(Math.abs(e.clientY-startY)>5)moved=true;const r=brightnessGauge.getBoundingClientRect();pendingBrightness=Math.max(0,Math.min(100,Math.round((r.bottom-e.clientY)/r.height*100)));document.querySelector("#brightness-fill").style.height=`${pendingBrightness}%`;document.querySelector("#brightness-dialog-fill").style.height=`${pendingBrightness}%`;document.querySelector("#brightness-dialog-value").textContent=`${pendingBrightness}%`};
    const dialog=document.querySelector("#volume-dialog"),largeGauge=document.querySelector("#volume-dialog-gauge"),largeBrightness=document.querySelector("#brightness-dialog-gauge");let closeTimer;
    const keepDialogOpen=()=>{clearTimeout(closeTimer);closeTimer=setTimeout(()=>closeDialog(dialog),5000)};
    const openDialog=()=>{dialog.dataset.ignoreClickUntil=Date.now()+350;dialog.showModal();for(const name of ["volume","brightness"]){const height=parseFloat(document.querySelector(`#${name}-fill`).style.height)||0;document.querySelector(`#${name}-dialog-fill`).style.height=`${height}%`;document.querySelector(`#${name}-dialog-value`).textContent=`${Math.round(height)}%`}keepDialogOpen()};
    gauge.onpointerup=()=>{if(!moved)openDialog()};brightnessGauge.onpointerup=()=>{if(moved)post(`/brightness/${pendingBrightness}`);else openDialog()};
    const updateLargeGauge=e=>{const r=largeGauge.getBoundingClientRect();setVolume((r.bottom-e.clientY)/r.height*100);keepDialogOpen()};
    largeGauge.onpointerdown=e=>{e.preventDefault();largeGauge.setPointerCapture(e.pointerId)};
    largeGauge.onpointermove=e=>{if(largeGauge.hasPointerCapture(e.pointerId))updateLargeGauge(e)};
    largeGauge.onwheel=e=>{e.preventDefault();const current=parseFloat(document.querySelector("#volume-dialog-fill").style.height)||0;setVolume(current-Math.sign(e.deltaY)*2);keepDialogOpen()};
    const updateLargeBrightness=e=>{const r=largeBrightness.getBoundingClientRect();pendingBrightness=Math.max(0,Math.min(100,Math.round((r.bottom-e.clientY)/r.height*100)));document.querySelector("#brightness-dialog-fill").style.height=`${pendingBrightness}%`;document.querySelector("#brightness-fill").style.height=`${pendingBrightness}%`;document.querySelector("#brightness-dialog-value").textContent=`${pendingBrightness}%`;keepDialogOpen()};
    largeBrightness.onpointerdown=e=>{e.preventDefault();largeBrightness.setPointerCapture(e.pointerId)};largeBrightness.onpointermove=e=>{if(largeBrightness.hasPointerCapture(e.pointerId))updateLargeBrightness(e)};largeBrightness.onpointerup=()=>post(`/brightness/${pendingBrightness}`);
    dialog.onclick=e=>{if(e.target.id==="volume-dialog"&&Date.now()>Number(dialog.dataset.ignoreClickUntil||0)){clearTimeout(closeTimer);closeDialog(dialog)}};
    const clockDialog=document.querySelector("#clock-dialog");document.querySelector("#clock-card").onclick=()=>{clockDialog.showModal();renderCalendar(0);updateWorldClocks()};
    clockDialog.onclick=e=>{if(!e.target.closest(".timer-wheels,button")&&!clockDialog.classList.contains("alarming"))closeDialog(clockDialog)};
    let calendarOffset=0,calendarY=0;
    const renderCalendar=delta=>{calendarOffset+=delta;const now=new Date(),month=new Date(now.getFullYear(),now.getMonth()+calendarOffset,1),year=month.getFullYear(),m=month.getMonth(),days=new Date(year,m+1,0).getDate(),first=(month.getDay()+6)%7,body=document.querySelector("#calendar-body");body.classList.remove("month-change","month-up","month-down");void body.offsetWidth;body.classList.add("month-change",delta>0?"month-up":"month-down");document.querySelector("#calendar-month").textContent=month.toLocaleDateString([],{month:"long",year:"numeric"});document.querySelector("#calendar-days").innerHTML=[...Array(first)].map(()=>"<i></i>").concat([...Array(days)].map((_,i)=>`<b class="${calendarOffset===0&&i+1===now.getDate()?"today":""}">${i+1}</b>`)).join("")};
    document.querySelector("#calendar").onpointerdown=e=>{calendarY=e.clientY};document.querySelector("#calendar").onpointerup=e=>{const d=e.clientY-calendarY;if(Math.abs(d)>25)renderCalendar(d<0?1:-1)};
    const zoneHour=zone=>Number(new Intl.DateTimeFormat("en",{hour:"2-digit",hour12:false,timeZone:zone}).format(new Date()))%24;
    const updateWorldClocks=()=>{const now=new Date(),fmt=(zone,seconds=false)=>now.toLocaleTimeString([],{hour:"2-digit",minute:"2-digit",...(seconds&&{second:"2-digit"}),hour12:false,timeZone:zone}),home=zoneHour("America/Chicago");document.querySelector("#minneapolis-clock").textContent=fmt("America/Chicago",true);for(const [id,zone] of [["beijing","Asia/Shanghai"],["california","America/Los_Angeles"],["new-york","America/New_York"]]){document.querySelector(`#${id}-clock`).textContent=fmt(zone);const delta=((zoneHour(zone)-home+36)%24)-12;document.querySelector(`#${id}-delta`).textContent=`${delta>=0?"+":""}${delta}h`}};setInterval(updateWorldClocks,1000);
    let timerInterval,audio;document.querySelectorAll(".timer-wheel").forEach(wheel=>{let snapTimer,dragging=false;const snap=()=>{if(dragging)return;const top=Math.round(wheel.scrollTop/44)*44;if(Math.abs(wheel.scrollTop-top)>.5)wheel.scrollTo({top,behavior:"smooth"})};wheel.addEventListener("pointerdown",()=>{dragging=true;clearTimeout(snapTimer)},{passive:true});wheel.addEventListener("pointerup",()=>{dragging=false;clearTimeout(snapTimer);snapTimer=setTimeout(snap,140)},{passive:true});wheel.addEventListener("pointercancel",()=>{dragging=false;snapTimer=setTimeout(snap,140)},{passive:true});wheel.addEventListener("scroll",()=>{clearTimeout(snapTimer);if(!dragging)snapTimer=setTimeout(snap,110)},{passive:true})});const timerValue=id=>Math.round(document.querySelector(`#${id}`).scrollTop/44);const stopTimer=()=>{clearInterval(timerInterval);document.querySelector(".timer").classList.remove("running");document.querySelector("#timer-start").textContent="Start"};
    const alarm=()=>{clockDialog.classList.add("alarming");audio=new AudioContext();const pulse=()=>{if(!clockDialog.classList.contains("alarming"))return;const o=audio.createOscillator(),g=audio.createGain();o.frequency.value=880;g.gain.setValueAtTime(.25,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+.35);o.connect(g).connect(audio.destination);o.start();o.stop(audio.currentTime+.35);setTimeout(pulse,500)};pulse()};
    document.querySelector("#alarm-stop").onclick=e=>{e.stopPropagation();clockDialog.classList.remove("alarming");audio?.close()};
    document.querySelector("#timer-start").onclick=e=>{e.stopPropagation();if(document.querySelector(".timer").classList.contains("running")){stopTimer();return}let remaining=timerValue("timer-hour")*3600+timerValue("timer-minute")*60+timerValue("timer-second");if(!remaining)return;document.querySelector(".timer").classList.add("running");document.querySelector("#timer-start").textContent="Stop";const out=document.querySelector("#timer-output"),draw=()=>{out.textContent=`${String(Math.floor(remaining/3600)).padStart(2,"0")}:${String(Math.floor(remaining%3600/60)).padStart(2,"0")}:${String(remaining%60).padStart(2,"0")}`};draw();timerInterval=setInterval(()=>{if(--remaining>=0)draw();else{stopTimer();alarm()}},1000)};
    const weatherDialog=document.querySelector("#weather-dialog"),cities={"minneapolis":"Minneapolis","los-angeles":"Los Angeles","detroit":"Detroit","new-york":"New York","guangzhou":"Guangzhou"},weatherCache=new Map();let weatherMode=0,weatherX=0,currentCity="minneapolis",weatherMoved=false,weatherTargetCity;
    const fetchWeather=async city=>{try{const data=await fetch(`/weather-details?city=${city}`,{cache:"no-store"}).then(r=>{if(!r.ok)throw Error(r.status);return r.json()});weatherCache.set(city,data);updateCityItem(city,data);if(currentCity===city)renderWeather(data)}catch(e){console.warn("weather update failed",city,e)}};
    const selectCity=city=>{if(city===currentCity&&weatherCache.has(city)){fetchWeather(city);return}currentCity=city;const main=document.querySelector(".weather-main");main.classList.remove("city-changing");void main.offsetWidth;main.classList.add("city-changing");document.querySelectorAll(".city-item").forEach(x=>x.classList.toggle("active",x.dataset.city===city));document.querySelector("#weather-place").innerHTML=`<b>${cities[city]}</b><span>Updating…</span>`;const cached=weatherCache.get(city);if(cached)renderWeather(cached);else document.querySelector("#weather-summary").innerHTML='<strong class="weather-loading">--°</strong>';fetchWeather(city)};
    const prefetchCities=()=>Object.keys(cities).filter(city=>city!=="minneapolis"&&!weatherCache.has(city)).forEach((city,i)=>setTimeout(()=>fetchWeather(city),i*180));
    document.querySelector("#weather-card").onclick=()=>{weatherDialog.showModal();selectCity(currentCity);prefetchCities()};
    weatherDialog.onclick=e=>{e.preventDefault();e.stopPropagation()};weatherDialog.onpointerdown=e=>{e.preventDefault();e.stopPropagation();weatherX=e.clientX;weatherMoved=false;weatherTargetCity=e.target.closest(".city-item")?.dataset.city;weatherDialog.setPointerCapture(e.pointerId)};weatherDialog.onpointermove=e=>{if(!weatherDialog.hasPointerCapture(e.pointerId))return;const d=e.clientX-weatherX;if(Math.abs(d)>8)weatherMoved=true;document.querySelector(".weather-main").style.transform=`translateX(${Math.max(-28,Math.min(28,d*.16))}px)`};weatherDialog.onpointerup=e=>{document.querySelector(".weather-main").style.transform="";const city=weatherTargetCity,d=e.clientX-weatherX;weatherTargetCity=undefined;if(city&&!weatherMoved){selectCity(city);return}if(Math.abs(d)>35){weatherMode=Math.max(0,Math.min(2,weatherMode+(d<0?1:-1)));setWeatherMode()}else if(!weatherMoved&&!e.target.closest(".weather-tab"))closeDialog(weatherDialog)};
    const weatherGlyph=code=>code===0?"☀️":code<4?"🌤️":code>=95?"⛈️":code>=71&&code<=86?"❄️":code>=51?"🌧️":"🌫️";
    const setWeatherMode=()=>{document.querySelectorAll(".weather-tab").forEach((x,i)=>x.classList.toggle("active",i===weatherMode));const chart=document.querySelector("#weather-chart");chart.classList.remove("weather-bounce");void chart.offsetWidth;chart.classList.add("weather-bounce");chart.dataset.mode=["temp","rain","wind"][weatherMode];if(globalThis.lastWeather)renderChart(globalThis.lastWeather)};
    const renderChart=w=>{const values=weatherMode===0?w.hourly.temperature_2m.slice(0,9):weatherMode===1?w.hourly.precipitation_probability.slice(0,9):[...Array(9)].map(()=>w.current.wind_speed_10m),min=Math.min(...values),max=Math.max(...values),range=max-min||1;document.querySelector("#chart-bars").innerHTML=values.map((v,i)=>`<div><b style="bottom:${18+(v-min)/range*55}%">${Math.round(v)}${weatherMode===0?"°":weatherMode===1?"%":""}</b><i style="height:${15+(v-min)/range*55}%"></i><span>${new Date(w.hourly.time[i]).toLocaleTimeString([],{hour:"numeric"})}</span></div>`).join("")};
    const updateCityItem=(city,w)=>{const item=document.querySelector(`.city-item[data-city="${city}"]`);if(item)item.innerHTML=`<b>${weatherGlyph(w.current.weather_code)} ${Math.round(w.current.temperature_2m)}°</b><span>${cities[city]}</span>`};
    const renderWeather=w=>{globalThis.lastWeather=w;document.querySelector("#weather-summary").innerHTML=`<span class="weather-big-icon">${weatherGlyph(w.current.weather_code)}</span><strong>${Math.round(w.current.temperature_2m)}°</strong><small>Feels ${Math.round(w.current.apparent_temperature)}°<br>Humidity ${w.current.relative_humidity_2m}%<br>Wind ${Math.round(w.current.wind_speed_10m)} km/h</small>`;document.querySelector("#weather-place").innerHTML=`<b>${cities[currentCity]}</b><span>${new Date().toLocaleDateString([],{weekday:"long",hour:"numeric",minute:"2-digit"})}</span>`;document.querySelector("#weather-days").innerHTML=w.daily.time.map((d,i)=>`<div><span>${new Date(d+"T12:00").toLocaleDateString([],{weekday:"short"})}</span><b>${weatherGlyph(w.daily.weather_code[i])}</b><small>${Math.round(w.daily.temperature_2m_max[i])}° <em>${Math.round(w.daily.temperature_2m_min[i])}°</em></small></div>`).join("");renderChart(w);updateCityItem(currentCity,w)};
    document.querySelectorAll(".weather-tab").forEach((tab,i)=>tab.onclick=e=>{e.stopPropagation();weatherMode=i;setWeatherMode()});
    document.addEventListener("pointerdown",e=>{const monitor=e.target.closest("#monitors .monitor-view");if(!monitor)return;const x=e.clientX;monitor.setPointerCapture(e.pointerId);monitor.onpointerup=up=>{const delta=up.clientX-x,base=Number(monitor.dataset.base),active=Number(monitor.dataset.active);const steps=Math.min(8,Math.floor(Math.abs(delta)/25));let target=active;if(steps)target=Math.max(base,Math.min(base+8,active+(delta<0?steps:-steps)));post(`/workspace/${target}`)}});
    fetchWeather("minneapolis");
  };
  document.addEventListener("DOMContentLoaded",()=>{for(const id of ["timer-hour","timer-minute","timer-second"]){const el=document.querySelector(`#${id}`),max=id==="timer-hour"?23:59;el.innerHTML=`<i></i>${[...Array(max+1)].map((_,i)=>`<b>${String(i).padStart(2,"0")}</b>`).join("")}<i></i>`}updateClock();setInterval(updateClock,1000);syncDisplayPower();bindGestures();new MutationObserver(syncDisplayPower).observe(document.body,{childList:true,subtree:true,attributes:true,attributeFilter:["data-on"]})});
  document.addEventListener("htmx:wsClose",()=>{const retry=()=>fetch("/",{cache:"no-store"}).then(r=>r.ok?location.reload():setTimeout(retry,1000)).catch(()=>setTimeout(retry,1000));setTimeout(retry,1000)},{once:true});
  </script>
</head>
<body class="min-h-screen bg-[#0b0c0f] font-sans text-[#f1f2f5] antialiased [color-scheme:dark]">
<div id="display-power" data-on="true" hidden></div>
<main id="dashboard" class="mx-auto grid min-h-dvh w-full max-w-6xl grid-cols-1 gap-3 p-4 sm:grid-cols-2" hx-ext="ws" ws-connect="/ws">
  <section id="clock-card" class="card relative">
    <span class="status-dot"></span><p id="date" class="label"></p>
    <time id="local-time" class="mt-3 block font-mono text-5xl font-medium leading-none tracking-[-.06em] tabular-nums"></time>
  </section>

  <section id="controls-card" class="card controls-card">
    <div id="volume-gauge" class="ios-gauge touch-none"><div id="volume-fill" class="ios-fill bg-[#f1f2f5]"></div><div class="gauge-content"><svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 4V5L7 9H3Zm13.5 3a4.5 4.5 0 0 0-2.5-4.03v8.05A4.5 4.5 0 0 0 16.5 12Z"/></svg><span id="volume" class="gauge-percent"></span></div></div>
    <div id="brightness-gauge" class="ios-gauge touch-none"><div id="brightness-fill" class="ios-fill bg-[#f1f2f5]"></div><div class="gauge-content"><svg viewBox="0 0 24 24"><path d="M12 7a5 5 0 1 0 0 10 5 5 0 0 0 0-10Zm0-5h1v3h-2V2h1Zm0 17h1v3h-2v-3h1ZM2 11h3v2H2v-2Zm17 0h3v2h-3v-2ZM4.22 5.64l1.42-1.42 2.12 2.12-1.42 1.42-2.12-2.12Zm12.02 12.02 1.42-1.42 2.12 2.12-1.42 1.42-2.12-2.12ZM4.22 18.36l2.12-2.12 1.42 1.42-2.12 2.12-1.42-1.42ZM16.24 6.34l2.12-2.12 1.42 1.42-2.12 2.12-1.42-1.42Z"/></svg><span id="brightness" class="gauge-percent"></span></div></div>
  </section>
  <section id="bluetooth-card" class="card control-grid">
    <span id="bluetooth-control" class="control-icon" title="Bluetooth">ᛒ</span>
    <span id="network-control" class="control-icon" title="Network"><svg viewBox="0 0 24 24"><path d="M2 8.8a16 16 0 0 1 20 0l-2 2.4a12.8 12.8 0 0 0-16 0L2 8.8Zm4 4.8a9.6 9.6 0 0 1 12 0L16 16a6.4 6.4 0 0 0-8 0l-2-2.4ZM9.8 18.4a3.2 3.2 0 0 1 4.4 0L12 21l-2.2-2.6Z"/></svg></span>
    <span id="input-control" class="control-icon font-mono text-[10px]" title="Input method">A</span>
    <span class="control-icon text-lg" title="Reserved">＋</span>
  </section>
  <section id="packages-card" class="card"><p class="label">Updates</p><p id="packages-total" class="big-number">—</p><div class="chips"><span id="packages-pacman" title="Official packages">◆ —</span><span id="packages-paru" title="AUR packages">▲ —</span></div></section>
  <section id="focus-card" class="card"><div id="monitors" class="monitor-layout"><p class="focus-title">Desktop</p><div class="monitor-grid"><div class="monitor-view" data-base="1" data-active="1"><div class="workspace-dots"><i class="active focused"></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div></div></div></div></section>

  <section id="media-card" class="card media-card">
    <img id="media-art" src="/artwork" alt="" onerror="this.hidden=true" onload="this.hidden=false">
    <div id="media-empty" class="media-empty" aria-hidden="true"><img src="/assets/arch-logo.png" alt=""></div><div id="media-copy" class="media-copy hidden"><p id="media-title" class="value truncate">Nothing playing</p><p id="media-artist" class="truncate text-[9px] text-[#a6acb9]"></p><div class="media-controls"><button onclick="fetch('/media/previous',{method:'POST'})" aria-label="Previous"><svg viewBox="0 0 24 24"><path d="M6 5h2v14H6zm3 7 9 7V5z"/></svg></button><button onclick="fetch('/media/play-pause',{method:'POST'})" aria-label="Play or pause"><svg viewBox="0 0 24 24"><path d="m8 5 11 7-11 7z"/></svg></button><button onclick="fetch('/media/next',{method:'POST'})" aria-label="Next"><svg viewBox="0 0 24 24"><path d="m6 5 9 7-9 7zm10 0h2v14h-2z"/></svg></button></div></div>
  </section>

  <section id="system-card" class="card"><div class="system-grid">
    <div><div class="metric-row"><svg viewBox="0 0 24 24" aria-label="CPU"><path d="M7 2h2v3h2V2h2v3h2V2h2v3h2v2h3v2h-3v2h3v2h-3v2h3v2h-3v2h-2v3h-2v-3h-2v3h-2v-3H9v3H7v-3H5v-2H2v-2h3v-2H2v-2h3V9H2V7h3V5h2V2Zm0 5v10h10V7H7Z"/></svg><span id="cpu" class="metric-value">—</span></div><div class="track"><i id="cpu-bar"></i></div></div>
    <div><div class="metric-row"><svg viewBox="0 0 24 24" aria-label="GPU"><path d="M3 5h18v13H3V5Zm2 2v9h14V7H5Zm3 2h8v5H8V9Zm-3 10h3v2H5v-2Zm5 0h4v2h-4v-2Zm6 0h3v2h-3v-2Z"/></svg><span id="gpu" class="metric-value">—</span></div><div class="track"><i id="gpu-bar"></i></div></div>
    <div><div class="metric-row"><svg viewBox="0 0 24 24" aria-label="Memory"><path d="M4 5h16v14H4V5Zm3 3v8h2V8H7Zm4 0v8h2V8h-2Zm4 0v8h2V8h-2ZM2 8h2v2H2V8Zm0 6h2v2H2v-2Zm18-6h2v2h-2V8Zm0 6h2v2h-2v-2Z"/></svg><span id="memory" class="metric-value">—</span></div><div class="track"><i id="memory-bar"></i></div></div>
    <div><div class="metric-row"><svg viewBox="0 0 24 24" aria-label="Disk"><path d="M4 3h16v18H4V3Zm2 2v14h12V5H6Zm6 2a5 5 0 1 1 0 10 5 5 0 0 1 0-10Zm0 3a2 2 0 1 0 0 4 2 2 0 0 0 0-4Z"/></svg><span id="disk" class="metric-value">—</span></div><div class="track"><i id="disk-bar"></i></div></div>
  </div></section>
  <section id="weather-card" class="card weather-card"><div class="weather-current"><span id="weather-icon">·</span><span id="weather-temp">—</span></div><div class="weather-range"><span id="weather-low">—</span><span class="text-[#666d7b]">·</span><span id="weather-high">—</span></div><p id="weather-label">Weather</p></section>
  <section id="agent-card" class="card agent-card idle"><div class="agent-list"><div class="agent-idle"><img src="/assets/pi-logo.svg" alt="Pi"></div></div></section>
  <section id="placeholder-card-3" class="card grid place-items-center"><span class="text-2xl text-[#666d7b]">＋</span></section>
  <section id="placeholder-card-4" class="card grid place-items-center"><span class="text-2xl text-[#666d7b]">＋</span></section>
</main>
