<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Raylander External Dock</title>
  <script src="/assets/htmx.min.js"></script>
  <script src="/assets/htmx-ext-ws.js"></script>
  <style>
    :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; background: #0b0c0f; color: #f1f2f5; }
    main { padding: 2rem; text-align: center; }
    h1 { margin: 0 0 1rem; font-size: clamp(2rem, 10vw, 5rem); }
    time { font: 500 clamp(1.5rem, 8vw, 4rem) ui-monospace, monospace; font-variant-numeric: tabular-nums; }
  </style>
</head>
<body>
  <main hx-ext="ws" ws-connect="/ws">
    <h1>Hello World</h1>
    <time id="server-time">{{ initial_time }}</time>
  </main>
</body>
</html>
