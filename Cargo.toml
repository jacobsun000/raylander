[package]
name = "raylander"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0"
askama = "0.14"
axum = { version = "0.8", features = ["ws"] }
chrono = "0.4"
clap = { version = "4.5", features = ["derive"] }
gio = { version = "0.21", features = ["v2_80"] }
gtk = { package = "gtk4", version = "0.10", features = ["v4_12"] }
gtk4-layer-shell = "0.7.1"
humantime = "2.3"
rustfft = "6.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["rt", "net", "time", "sync"] }
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
zbus = { version = "5.14", default-features = false, features = ["async-io"] }
