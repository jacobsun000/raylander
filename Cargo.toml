[package]
name = "raylander"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0"
askama = "0.14"
axum = { version = "0.8", features = ["ws"] }
chrono = "0.4"
clap = { version = "4.5", features = ["derive"] }
rustfft = "6.4"
libpulse-binding = "2.30"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["rt", "net", "time", "sync"] }
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
zbus = { version = "5.14", default-features = false, features = ["async-io", "blocking-api"] }
